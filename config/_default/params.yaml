# Appearance
appearance:
  mode: system
  color: indigo
  content_width: wide  # narrow | wide | full 중 선택 가능

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Personal academic website of Suho Shin.'
    twitter: 'GetResearchDev'
  analytics:
    google_analytics: ''
  verification:
    google: ''

# Site header
header:
  navbar:
    enable: true
    fixed_to_top: true
    show_search: true
    show_theme_chooser: false
    logo:
      text: 'Suho Shin'

# Site footer
footer:
  copyright:
    notice: '© {year} Suho Shin. All rights reserved.'
    license:
      enable: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false

# ✅ 커스텀 CSS (선택사항 — 지금은 head-end 훅이 있으니 생략해도 됨)
# assets:
#   css:
#     - "css/custom.css"

# ✅ 홈을 _index.md 기반으로 강제 지정
home:
  type: page
